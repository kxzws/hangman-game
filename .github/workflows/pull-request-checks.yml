name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Formatting, linting, tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and linting
        run: npm run check

      - name: Run tests
        run: npm run test:ci

      - name: Type-check and build
        run: npm run build
